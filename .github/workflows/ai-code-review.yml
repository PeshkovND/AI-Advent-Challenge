name: AI code review

# This workflow must be installed in the default branch before it can review PRs.
# Only trusted default-branch code runs. PR commits are fetched/read as Git objects.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Set report directory
        run: echo "REVIEW_OUTPUT=$RUNNER_TEMP/ai-code-review" >> "$GITHUB_ENV"

      - name: Check out trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install trusted dependencies
        run: npm ci --ignore-scripts

      - name: Fetch PR objects without checking out PR code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH_HEADER" fetch --no-tags origin "$PR_HEAD_SHA"

      - name: Check model configuration
        id: config
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo '::error::Add repository secret DEEPSEEK_API_KEY to enable AI review.'
            echo 'AI review was not run: repository secret DEEPSEEK_API_KEY is missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Review diff with documentation and code RAG
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-v4-flash' }}
        run: npm run review:pr -- --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --output "$REVIEW_OUTPUT"

      - name: Add review to job summary
        if: ${{ always() && steps.review.outcome != 'skipped' }}
        run: |
          if [ -f "$REVIEW_OUTPUT/review.md" ]; then
            cat "$REVIEW_OUTPUT/review.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish or update PR review comment
        if: ${{ !cancelled() && steps.review.outcome != 'skipped' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const filename = path.join(process.env.REVIEW_OUTPUT, 'comment.md');
            if (!fs.existsSync(filename)) return;
            const current = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            if (current.data.state !== 'open' || current.data.head.sha !== process.env.PR_HEAD_SHA || current.data.base.sha !== process.env.PR_BASE_SHA) {
              core.info('PR changed during review; keeping report as an artifact without publishing a stale comment.');
              return;
            }
            const body = fs.readFileSync(filename, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith('<!-- day-32-ai-review -->'));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Save full review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review
          path: ${{ env.REVIEW_OUTPUT }}/
          if-no-files-found: ignore
          retention-days: 7
